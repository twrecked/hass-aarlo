name: HACS Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'version-*'
  pull_request:
    branches:
      - main
      - 'version-*'
  schedule:
    - cron: '0 2 * * *'

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: "integration"
