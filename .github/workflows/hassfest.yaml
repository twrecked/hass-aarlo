name: hassfest Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'version-*'
  pull_request:
    branches:
      - main
      - 'version-*'
  schedule:
    - cron: '0 1 * * *'

jobs:
  validate:
    name: hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Hassfest Validation
        uses: home-assistant/actions/hassfest@master
